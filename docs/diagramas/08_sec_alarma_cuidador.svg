,2.0;" x1="185" x2="335" y1="354.7148" y2="354.7148"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="132" x="197" y="349.5791">alerta "Sin confirmar"</text><line style="stroke: #000000; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="137" x2="631.5" y1="363.7148" y2="363.7148"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="84" x="142" y="374.3711">[ya confirmada]</text><polygon fill="#A80036" points="552,395.7539,562,399.7539,552,403.7539,556,399.7539" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="336" x2="558" y1="399.7539" y2="399.7539"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="47" x="343" y="394.6182">cancela</text><path d="M8,419.7539 L8,444.7539 L661,444.7539 L661,429.7539 L651,419.7539 L8,419.7539 " fill="#FBFB77" filter="url(#f1sf9dzzbrtmqj)" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M651,419.7539 L651,429.7539 L661,429.7539 L651,419.7539 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="632" x="14" y="437.3477">Si no hay red, se alerta con la última información y se avisa la hora de la última sincronización (RF-12).</text><!--
@startuml
title Secuencia - alarma local del cuidador a T+30 (RF-18)
actor Cuidador
participant "App cuidador" as App
participant "AlarmManager" as AL
participant "API" as A
App -> A : GET /caregiver/patients/{id}/intakes/today
A - -> App : tomas del día con estado
loop por cada toma pendiente
  App -> AL : programa alarma exacta en T+30
end
AL -> App : dispara alarma T+30
App -> A : GET intakes/today (verifica)
alt sigue sin confirmar
  App - -> Cuidador : alerta "Sin confirmar"
else ya confirmada
  App -> AL : cancela
end
note over App : Si no hay red, se alerta con la última información y se avisa la hora de la última sincronización (RF-12).
@enduml

