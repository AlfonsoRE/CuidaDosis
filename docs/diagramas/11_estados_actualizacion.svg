00" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="95" x="279.5" y="250.373">falla la consulta</text><!--link SinConexion to Actualizada--><path d="M72.66,206.8493 C84.07,222.8393 101.2,242.8293 121.5,253.7793 C171.92,280.9793 333.78,297.0993 419.33,303.9193 " fill="none" id="SinConexion-Actualizada" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="424.35,304.3193,415.6987,299.6124,419.366,303.9194,415.0589,307.5867,424.35,304.3193" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="100" x="122.5" y="250.373">consulta exitosa</text><!--link Desactualizada to SinConexion--><path d="M412.72,72.4493 C343.22,91.7393 226.17,124.9593 126.5,156.7793 C122.42,158.0793 118.21,159.4593 113.99,160.8693 " fill="none" id="Desactualizada-SinConexion" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="109.02,162.5293,118.8239,163.4691,113.762,160.9439,116.2872,155.8819,109.02,162.5293" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="95" x="279.5" y="123.373">falla la consulta</text><!--
@startuml
title Estados de actualización de la información del cuidador (ADR-012)
[*] - -> Actualizada : consulta exitosa
Actualizada - -> Desactualizada : 15 min o más sin consulta exitosa
Actualizada - -> SinConexion : falla la consulta
Desactualizada - -> Actualizada : consulta exitosa
Desactualizada - -> SinConexion : falla la consulta
SinConexion - -> Actualizada : consulta exitosa
state "Sin conexión" as SinConexion
note right of Desactualizada : Muestra la hora de la última consulta.\n"Sin alerta no significa sin tomas pendientes".
note right of SinConexion : Muestra la hora de la última consulta\ny la última sincronización del paciente.
@enduml

