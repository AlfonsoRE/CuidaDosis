6893,619,786.6893,615,782.6893,619,791.6893" style="stroke: #A80036; stroke-width: 1.0;"/><!--link DAO to DB--><path d="M619,829.1293 C619,844.8293 619,867.9293 619,886.0393 " fill="none" id="DAO-DB" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#A80036" points="619,891.4793,623,882.4793,619,886.4793,615,882.4793,619,891.4793" style="stroke: #A80036; stroke-width: 1.0;"/><!--link ALM to GMN26--><path d="M170.11,408.7793 C192.54,396.8993 220.56,384.2893 247.5,378.2793 C350.52,355.2993 618.7,359.1293 722.5,378.2793 C760.73,385.3393 801.82,401.6793 831.38,415.1493 " fill="none" id="ALM-GMN26" style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><!--
@startuml
title Arquitectura de componentes - stack del equipo (gratuito)
skinparam shadowing false
skinparam componentStyle rectangle
package "App Android (Kotlin + Compose)" {
  [UI Compose\n(pantallas)] as UI
  [ViewModels] as VM
  [Repositorios\n(offline-first)] as REPO
  [Almacén local\n(cola de confirmaciones + UUID)] as LOC
  [Planificador de alarmas\nAlarmManager exacto] as ALM
  [Cliente API\nRetrofit + kotlinx.serialization] as API
  [SessionStore\nAES-GCM + Keystore] as SES
}
package "Servidor (PHP 8 + Apache)" {
  [Router + Controladores] as CTRL
  [Servicios de dominio\n(estado calculado, vínculo, intentos)] as SVC
  [Acceso a datos PDO] as DAO
}
database "MariaDB" as DB
UI - -> VM
VM - -> REPO
REPO - -> LOC
REPO - -> API
REPO - -> ALM
VM - -> SES
API - -> CTRL : HTTPS / JSON\nBearer token
CTRL - -> SVC
SVC - -> DAO
DAO - -> DB
note right of ALM
  Alarmas locales: paciente (T-L, T)
  y cuidador (T+30). Sin push.
end note
@enduml

